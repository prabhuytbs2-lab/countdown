<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM DECRYPTING...</title>
    <style>
        body { background: black; color: #00FF00; font-family: 'Courier New', Courier, monospace; overflow: hidden; margin: 0; }
        #canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.3; }
        #timer-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #countdown { font-size: 5rem; font-weight: bold; text-shadow: 0 0 10px #00FF00; z-index: 10; padding: 20px; background: rgba(0,0,0,0.8); }
        .glitch { animation: shake 0.5s infinite; color: #FF0000; }
        @keyframes shake {
            0% { transform: translate(0,0); }
            20% { transform: translate(-5px, 5px); color: white; }
            40% { transform: translate(5px, -5px); }
            100% { transform: translate(0,0); }
        }
        #exit-btn { display: none; margin-top: 20px; padding: 10px 20px; border: 1px solid #00FF00; background: black; color: #00FF00; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="timer-container">
        <div id="countdown">LOADING...</div>
        <button id="exit-btn" onclick="window.close()">ABORT SYSTEM</button>
    </div>

    <script>
        // Matrix Background
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = "01".split("");
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#003300";
            ctx.font = fontSize + "px Courier New";
            drops.forEach((y, i) => {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 30);

        // Countdown Logic
        function updateTimer() {
            const target = new Date("May 19, 2026 00:00:00").getTime();
            const now = new Date().getTime();
            const diff = target - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('countdown').innerHTML = `${days}d ${hours}h ${mins}m ${secs}s`;
            
            // Random Glitch
            if (Math.random() > 0.95) {
                document.getElementById('countdown').classList.add('glitch');
                setTimeout(() => document.getElementById('countdown').classList.remove('glitch'), 150);
            }
        }
        setInterval(updateTimer, 1000);

        // Show exit button after 5 seconds
        setTimeout(() => { document.getElementById('exit-btn').style.display = 'block'; }, 5000);
    </script>
</body>
</html>
