<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYSTEM DECRYPTING...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; touch-action: none; }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: flex; justify-content: center; align-items: center; color: #00FF00; cursor: pointer; text-align: center; }
        #ui { position: relative; z-index: 10; height: 100vh; display: none; flex-direction: column; justify-content: center; align-items: center; color: #00FF00; font-family: monospace; pointer-events: none; }
        #timer { font-size: clamp(1.5rem, 5vw, 4rem); border: 2px solid #00FF00; padding: 20px; background: rgba(0,0,0,0.9); box-shadow: 0 0 20px #00FF00; text-align: center; }
        #abort-btn { margin-top: 20px; padding: 10px 20px; border: 1px solid #00FF00; background: black; color: #00FF00; cursor: pointer; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="overlay" onclick="startSystem()"><h1>[ TAP TO INITIALIZE SYSTEM ]</h1></div>
    <canvas id="m"></canvas>
    <div id="ui">
        <div id="timer">00d 00h 00m 00s</div>
        <button id="abort-btn" onclick="location.href='https://google.com'">ABORT SYSTEM</button>
    </div>

    <script>
        const c = document.getElementById("m");
        const ctx = c.getContext("2d");
        const t = document.getElementById("timer");

        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            c.width = window.innerWidth * dpr;
            c.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }

        function startSystem() {
            document.getElementById("overlay").style.display = "none";
            document.getElementById("ui").style.display = "flex";
            setupCanvas();

            // Attempt Fullscreen (Works on most Android, some iPad)
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            // Matrix Logic
            const fontSize = 18;
            const columns = Math.floor(window.innerWidth / fontSize);
            const drops = Array(columns).fill(0);

            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
                ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
                ctx.fillStyle = "#0F0";
                ctx.font = fontSize + "px monospace";
                for (let i = 0; i < drops.length; i++) {
                    const text = Math.random() > 0.5 ? "1" : "0";
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > window.innerHeight && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);

            // Countdown Logic
            setInterval(() => {
                const diff = new Date("May 19, 2026") - new Date();
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                t.innerText = `${d}d ${h}h ${m}m ${s}s`;
            }, 1000);
        }
        window.onresize = setupCanvas;
    </script>
</body>
</html>
