<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DECRYPTING...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #00FF00; font-family: monospace; pointer-events: none; }
        #timer { font-size: 3rem; border: 2px solid #00FF00; padding: 20px; background: rgba(0,0,0,0.9); }
        #start-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: flex; justify-content: center; align-items: center; color: #00FF00; cursor: pointer; }
    </style>
</head>
<body>
    <div id="start-screen" onclick="begin()"><h1>[ TAP TO START ]</h1></div>
    <canvas id="m"></canvas>
    <div id="ui">
        <div id="timer">INITIALIZING...</div>
    </div>

    <script>
        const c = document.getElementById("m");
        const ctx = c.getContext("2d");
        const t = document.getElementById("timer");

        function begin() {
            document.getElementById("start-screen").style.display = "none";
            // Attempt Fullscreen
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            
            // Set Canvas Size
            c.width = window.innerWidth;
            c.height = window.innerHeight;
            
            // Matrix Effect
            const columns = Math.floor(c.width / 20);
            const drops = Array(columns).fill(0);

            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.fillStyle = "#0F0";
                ctx.font = "20px monospace";
                for (let i = 0; i < drops.length; i++) {
                    const text = Math.floor(Math.random() * 2);
                    ctx.fillText(text, i * 20, drops[i] * 20);
                    if (drops[i] * 20 > c.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 50);

            // Countdown Logic
            setInterval(() => {
                const diff = new Date("May 19, 2026") - new Date();
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                t.innerText = `${d}d ${h}h ${m}m ${s}s`;
            }, 1000);
        }
    </script>
</body>
</html>
