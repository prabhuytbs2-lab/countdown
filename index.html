<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Countdown Tool</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #000; }
        
        /* Welcoming Intro Screen */
        #start-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); 
            z-index: 200; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; cursor: pointer; 
        }
        
        .welcome-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 80%; }
        h1 { color: #2e7d32; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 25px; line-height: 1.4; }
        #start-btn { 
            padding: 15px 40px; background: #2e7d32; 
            color: white; border-radius: 50px; border: none;
            font-weight: bold; font-size: 1.2rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(46,125,50,0.3);
        }

        /* Hacker Elements */
        #hacker-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 1; display: none; }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: none; }
        
        #ui { 
            position: relative; z-index: 10; height: 100vh; display: none; 
            flex-direction: column; justify-content: center; align-items: center; 
            color: #0f0; font-family: 'Courier New', monospace; pointer-events: none; 
            text-align: center;
        }
        
        #hacked-text { font-size: clamp(1.5rem, 6vw, 4rem); color: #f00; font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 30px #f00; padding: 20px; }
        #timer { font-size: clamp(1rem, 4vw, 2.5rem); font-weight: bold; border: 4px solid #0f0; padding: 20px; background: rgba(0,0,0,0.9); box-shadow: 0 0 40px #0f0; }

        /* Popup Box Style */
        .popup-box {
            position: absolute; padding: 8px 15px; background: black; border: 2px solid #0f0;
            color: #0f0; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold;
            z-index: 150; pointer-events: none; box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            text-transform: uppercase;
        }

        /* Intense Flashing Green Strobe */
        .strobe { animation: strobe-bg 0.1s infinite; }
        @keyframes strobe-bg {
            0% { background: black; }
            50% { background: #00FF00; } 
            100% { background: black; }
        }
    </style>
</head>
<body>

    <!-- Welcoming Intro Screen -->
    <div id="start-overlay" onclick="triggerHack()">
        <div class="welcome-box">
            <h1>Personal Countdown Tool</h1>
            <p>Welcome! This application will help you track the exact time remaining until your target date.</p>
            <button id="start-btn">Click to Start Program</button>
        </div>
    </div>

    <!-- Hidden Chaos Elements -->
    <div id="hacker-bg"></div>
    <canvas id="m"></canvas>

    <div id="ui">
        <div id="hacked-text">SYSTEM COMPROMISED<br>U R HACKED</div>
        <div id="timer">00d 00h 00m 00s</div>
    </div>

    <script>
        const c = document.getElementById("m");
        const ctx = c.getContext("2d");
        const t = document.getElementById("timer");
        
        let popupInterval;
        let matrixInterval;
        let countdownInterval;

        function triggerHack() {
            // 1. Show Hacker UI
            document.getElementById("start-overlay").style.display = "none";
            document.getElementById("hacker-bg").style.display = "block";
            document.getElementById("ui").style.display = "flex";
            document.getElementById("m").style.display = "block";
            document.getElementById("hacker-bg").classList.add("strobe");

            // 2. Fullscreen
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            // 3. Start Loops
            setupMatrix();
            startCountdown();
            popupInterval = setInterval(createPopup, 300); // Spawns box every 0.3s
        }

        function createPopup() {
            const box = document.createElement("div");
            box.className = "popup-box";
            const msgs = ["ACCESSING CAMERA", "ENCRYPTING FILES", "IP: 192.168.1.1", "U R HACKED", "DOWNLOADING DATA", "WIPING DRIVE"];
            box.innerText = msgs[Math.floor(Math.random() * msgs.length)];
            
            // Random positioning
            const x = Math.random() * (window.innerWidth - 150);
            const y = Math.random() * (window.innerHeight - 50);
            box.style.left = x + "px";
            box.style.top = y + "px";
            
            document.body.appendChild(box);
            
            // Auto-cleanup popups every 3 seconds to avoid lag
            setTimeout(() => { if(box) box.remove(); }, 3000);
        }

        function setupMatrix() {
            c.width = window.innerWidth;
            c.height = window.innerHeight;
            const fontSize = 20;
            const columns = Math.floor(c.width / fontSize);
            const drops = Array(columns).fill(0);

            function draw() {
                ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.fillStyle = "#0f0"; 
                ctx.font = fontSize + "px monospace";

                for (let i = 0; i < drops.length; i++) {
                    const text = Math.random() > 0.5 ? "1" : "0";
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > c.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            matrixInterval = setInterval(draw, 35);
        }

        function startCountdown() {
            const targetDate = new Date("May 19, 2026 00:00:00").getTime();
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const diff = targetDate - now;
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                t.innerText = `${d}d ${h}h ${m}m ${s}s`;
            }, 1000);
        }

        // THE "EVERYTHING GOES" ESCAPE BUTTON
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                // 1. Stop all repeating scripts
                clearInterval(popupInterval);
                clearInterval(matrixInterval);
                clearInterval(countdownInterval);

                // 2. Remove all "Hacked" boxes immediately
                const allPopups = document.querySelectorAll('.popup-box');
                allPopups.forEach(box => box.remove());

                // 3. Hide Hacker UI and reset background
                document.getElementById("hacker-bg").style.display = "none";
                document.getElementById("hacker-bg").classList.remove("strobe");
                document.getElementById("ui").style.display = "none";
                document.getElementById("m").style.display = "none";

                // 4. Show the original welcome screen
                document.getElementById("start-overlay").style.display = "flex";

                // 5. Exit Fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        window.onresize = () => { c.width = window.innerWidth; c.height = window.innerHeight; };
    </script>
</body>
</html>
